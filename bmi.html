<!DOCTYPE html>
<html lang="hu">

<head>
	<meta charset="utf-8">
	<title>Projekt feladat - BMI kalkulátor</title>
	<meta name="author" content="Kuti Anett">
	<meta name="description" content="Számold ki a BMI értékedet és a napi energiaszükségleted a fogyi program indulásához.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="" />
	<style>
		:root {
			--form-ui-color: #ff7b5b;
			--form-ui-bg: #ffffff;
			--form-size: 2rem;
			--form-border-radius: 0.25rem;
		}

		*,
		*:before,
		*:after {
			box-sizing: border-box;
		}

		body {
			background: url(bmi.jpg);
			background-size: cover;
			background-attachment: fixed;
			padding: 4rem 8rem;
			font-family: sans-serif;
			margin: 0;
		}

		#get-bmi {
			width: 50%;
			float: right;
		}

		.field {
			margin-bottom: 1.75rem;
		}

		.field label.field-label {
			display: block;
			font-weight: bold;
			font-size: 1.1rem;
			margin-bottom: 0.6rem;
		}

		.stepper {
			display: inline-flex;
			align-items: center;
			gap: 0.75rem;
		}

		.stepper button {
			width: var(--form-size);
			height: var(--form-size);
			border-radius: 50%;
			border: 1px solid #333;
			background: var(--form-ui-bg);
			font-size: 1.2rem;
			line-height: 1;
			cursor: pointer;
		}

		.stepper input {
			width: 4rem;
			height: var(--form-size);
			text-align: center;
			font-size: 1.1rem;
			border: 1px solid #333;
			border-radius: var(--form-border-radius);
			background: var(--form-ui-bg);
			-moz-appearance: textfield;
		}

		.stepper input::-webkit-outer-spin-button,
		.stepper input::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		.radio-group {
			display: flex;
			flex-wrap: wrap;
			gap: 1.5rem;
		}

		.radio-group label {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			font-size: 1.05rem;
			cursor: pointer;
		}

		.radio-group input[type="radio"] {
			width: 1.1rem;
			height: 1.1rem;
			accent-color: var(--form-ui-color);
			cursor: pointer;
		}

		#calculate {
			background: var(--form-ui-color);
			color: #fff;
			border: none;
			padding: 1rem 2.5rem;
			font-size: 1rem;
			font-weight: bold;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			border-radius: 2rem;
			cursor: pointer;
			margin-top: 0.5rem;
		}

		#calculate:hover {
			opacity: 0.9;
		}

		#results {
			width: 50%;
			float: right;
			clear: both;
			font-weight: bold;
			margin-top: 2rem;
		}

		#results p {
			margin: 0.3rem 0;
		}

		#results .warning {
			color: #b00020;
		}

		#results .ok {
			color: #1b7a1b;
		}

	</style>
</head>

<body>
	<div id="get-bmi">

		<div class="field">
			<label class="field-label">Életkora</label>
			<div class="stepper">
				<button type="button" class="dec" data-target="age">-</button>
				<input type="number" id="age" value="30" min="10">
				<button type="button" class="inc" data-target="age">+</button>
			</div>
		</div>

		<div class="field">
			<label class="field-label">Testsúlya</label>
			<div class="stepper">
				<button type="button" class="dec" data-target="weight">-</button>
				<input type="number" id="weight" value="70" min="1">
				<button type="button" class="inc" data-target="weight">+</button>
			</div>
		</div>

		<div class="field">
			<label class="field-label">Testmagassága</label>
			<div class="stepper">
				<button type="button" class="dec" data-target="height">-</button>
				<input type="number" id="height" value="170" min="1">
				<button type="button" class="inc" data-target="height">+</button>
			</div>
		</div>

		<div class="field">
			<label class="field-label">Az Ön neme</label>
			<div class="radio-group">
				<label><input type="radio" name="gender" value="no" checked> nő</label>
				<label><input type="radio" name="gender" value="ferfi"> férfi</label>
			</div>
		</div>

		<div class="field">
			<label class="field-label">Sport aktivitás</label>
			<div class="radio-group">
				<label><input type="radio" name="activity" value="nemaktiv" checked> nem aktív</label>
				<label><input type="radio" name="activity" value="mersekeltenaktiv"> mérsékelten aktív</label>
				<label><input type="radio" name="activity" value="aktiv"> aktív</label>
			</div>
		</div>

		<div class="field">
			<label class="field-label">Munkavégzés</label>
			<div class="radio-group">
				<label><input type="radio" name="work" value="konnyu" checked> könnyű munka</label>
				<label><input type="radio" name="work" value="mersekelt"> mérsékelt munka</label>
				<label><input type="radio" name="work" value="nehez"> nehéz munka</label>
			</div>
		</div>

		<button id="calculate" type="button">BMI SZÁMÍTÁS</button>

	</div>

	<div id="results"></div>

	<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>

	<script type="text/javascript">
		$(document).ready(function($) {

			// Napi alapanyagcsere (BMR) együtthatók életkor és nem szerint: [szorzó, konstans]
			var bmrTable = {
				ferfi: [
					{ min: 10, max: 18, factor: 17.5, constant: 651 },
					{ min: 18, max: 30, factor: 15.3, constant: 679 },
					{ min: 30, max: 60, factor: 11.6, constant: 879 },
					{ min: 60, max: Infinity, factor: 13.5, constant: 487 }
				],
				no: [
					{ min: 10, max: 18, factor: 12.2, constant: 746 },
					{ min: 18, max: 30, factor: 17.5, constant: 496 },
					{ min: 30, max: 60, factor: 8.7, constant: 829 },
					{ min: 60, max: Infinity, factor: 10.5, constant: 596 }
				]
			};

			// Aktivitási szorzók: [sport aktivitás][munka jellege]
			var activityTable = {
				ferfi: {
					nemaktiv: { konnyu: 1.4, mersekelt: 1.6, nehez: 1.7 },
					mersekeltenaktiv: { konnyu: 1.5, mersekelt: 1.7, nehez: 1.8 },
					aktiv: { konnyu: 1.6, mersekelt: 1.8, nehez: 1.9 }
				},
				no: {
					nemaktiv: { konnyu: 1.4, mersekelt: 1.5, nehez: 1.5 },
					mersekeltenaktiv: { konnyu: 1.5, mersekelt: 1.6, nehez: 1.6 },
					aktiv: { konnyu: 1.6, mersekelt: 1.7, nehez: 1.7 }
				}
			};

			function findBmrRow(gender, age) {
				var rows = bmrTable[gender];
				for (var i = 0; i < rows.length; i++) {
					if (age >= rows[i].min && age < rows[i].max) {
						return rows[i];
					}
				}
				return null;
			}

			// +/- léptető gombok
			$('.stepper button').on('click', function() {
				var targetId = $(this).data('target');
				var input = $('#' + targetId);
				var min = parseFloat(input.attr('min')) || 0;
				var value = parseFloat(input.val()) || 0;
				if ($(this).hasClass('inc')) {
					value += 1;
				} else {
					value = Math.max(min, value - 1);
				}
				input.val(value);
			});

			$('#calculate').on('click', function() {
				var gender = $('input[name="gender"]:checked').val();
				var age = parseFloat($('#age').val());
				var weight = parseFloat($('#weight').val());
				var heightCm = parseFloat($('#height').val());
				var work = $('input[name="work"]:checked').val();
				var activity = $('input[name="activity"]:checked').val();

				if (!age || age < 10 || !weight || weight <= 0 || !heightCm || heightCm <= 0) {
					$('#results').html('<p class="warning">Kérlek, tölts ki minden mezőt érvényes értékkel (az életkor legalább 10 év legyen).</p>');
					return;
				}

				var heightM = heightCm / 100;
				var bmi = weight / (heightM * heightM);

				var bmrRow = findBmrRow(gender, age);
				var bmr = bmrRow.factor * bmi + bmrRow.constant;

				var activityFactor = activityTable[gender][activity][work];
				var dailyEnergy = bmr * activityFactor;

				var bmiClass = 'ok';
				var bmiMessage = 'Ez az ideális testsúly tartomány.';
				if (bmi < 18.5) {
					bmiClass = 'warning';
					bmiMessage = 'Ez a normálisnál alacsonyabb testsúlyt jelez.';
				} else if (bmi > 24.9) {
					bmiClass = 'warning';
					bmiMessage = 'Ez a normálisnál magasabb testsúlyt jelez - épp neked való a fogyi programunk!';
				}

				var html = '';
				html += '<p>BMI érték: ' + bmi.toFixed(1) + '</p>';
				html += '<p class="' + bmiClass + '">' + bmiMessage + ' (ideális tartomány: 18.5 - 24.9)</p>';
				html += '<p>Napi alapanyagcsere szükséglet: ' + Math.round(bmr) + ' kcal/nap</p>';
				html += '<p>Napi energiaszükséglet: ' + Math.round(dailyEnergy) + ' kcal/nap</p>';

				$('#results').html(html);
			});

		});
	</script>
</body>

</html>
