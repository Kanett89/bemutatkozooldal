<!DOCTYPE html>
<html lang="hu">

<head>
	<meta charset="utf-8">
	<title>Kínai horoszkóp kalkulátor</title>
	<meta name="author" content="Kuti Anett">
	<meta name="description" content="Add meg a születési éved, és megtudod, melyik kínai állatjegy tartozik hozzád.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="" />
	<style>
		*,
		*:before,
		*:after {
			box-sizing: border-box;
		}

		body {
			background: linear-gradient(135deg, #2b0a3d, #6a1b9a 60%, #b71c8c);
			min-height: 100vh;
			padding: 4rem 8rem;
			font-family: sans-serif;
			color: #fff;
		}

		h1 {
			width: 50%;
			float: right;
			clear: both;
			margin: 0 0 1rem;
		}

		p.intro {
			width: 50%;
			float: right;
			clear: both;
			margin: 0 0 2rem;
		}

		#get-horoszkop {
			width: 50%;
			float: right;
			background: rgba(255, 255, 255, 0.1);
			padding: 1.5rem;
			border-radius: 0.5rem;
			backdrop-filter: blur(2px);
		}

		#get-horoszkop label {
			display: block;
			margin-top: 0.75rem;
			font-weight: bold;
		}

		#get-horoszkop input {
			width: 100%;
			padding: 0.4rem;
			margin-top: 0.25rem;
		}

		#results {
			width: 50%;
			float: right;
			clear: both;
			margin-top: 2rem;
			background: rgba(255, 255, 255, 0.9);
			color: #2b0a3d;
			padding: 1.5rem;
			border-radius: 0.5rem;
		}

		#results .animal {
			font-size: 2rem;
			font-weight: bold;
			margin: 0 0 0.5rem;
		}

		#results .warning {
			color: #b00020;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<h1>Kínai horoszkóp kalkulátor</h1>
	<p class="intro">Add meg a születési éved, és a rendszer kiszámolja, melyik kínai állatjegy tartozik hozzád - a kínai horoszkóp 12 éves ciklusban ismétlődő 12 szimbólumból áll, 1900-tól kezdve a Patkány jegyével.</p>

	<div id="get-horoszkop">
		<label for="birthyear">Születési év</label>
		<input type="number" id="birthyear" min="1900" step="1" placeholder="pl. 1985">
	</div>

	<div id="results"></div>

	<script type="text/javascript">
		// Kínai állatjegyek, 1900-tól (Patkány) kezdődő sorrendben
		var zodiacAnimals = [
			{ name: 'Patkány', description: 'Talpraesett, alkalmazkodó és jó megfigyelő.' },
			{ name: 'Bivaly', description: 'Kitartó, megbízható és szorgalmas.' },
			{ name: 'Tigris', description: 'Bátor, magabiztos és karizmatikus.' },
			{ name: 'Nyúl', description: 'Kedves, óvatos és diplomatikus.' },
			{ name: 'Sárkány', description: 'Energikus, önbizalommal teli és karizmatikus vezető.' },
			{ name: 'Kígyó', description: 'Bölcs, rejtélyes és intuitív.' },
			{ name: 'Ló', description: 'Szabadságszerető, energikus és társaságkedvelő.' },
			{ name: 'Kecske', description: 'Kreatív, gyengéd és együttérző.' },
			{ name: 'Majom', description: 'Okos, szellemes és leleményes.' },
			{ name: 'Kakas', description: 'Magabiztos, precíz és szókimondó.' },
			{ name: 'Kutya', description: 'Hűséges, becsületes és igazságszerető.' },
			{ name: 'Disznó', description: 'Nagylelkű, őszinte és szorgalmas.' }
		];

		function getZodiacIndex(birthYear) {
			var years = birthYear - 1900;
			return years - Math.floor(years / 12) * 12;
		}

		function showZodiac() {
			var results = document.getElementById('results');
			var birthYear = parseInt(document.getElementById('birthyear').value, 10);

			if (!birthYear || birthYear < 1900) {
				results.innerHTML = '<p class="warning">Kérlek, adj meg egy érvényes, 1900 utáni születési évet.</p>';
				return;
			}

			var index = getZodiacIndex(birthYear);
			var animal = zodiacAnimals[index];

			var html = '';
			html += '<p class="animal">' + animal.name + '</p>';
			html += '<p>' + animal.description + '</p>';
			results.innerHTML = html;
		}

		document.getElementById('birthyear').addEventListener('change', showZodiac);
	</script>
</body>

</html>
